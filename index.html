<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="theme-color" content="#0b0b10">
<title>আমার ডায়েরি — Stories & Life</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#08090d;--card:#11131a;--card2:#171923;
 --text:#f7f7fa;--muted:#9296a5;--line:#242735;
 --primary:#8b5cf6;--primary2:#6d28d9;
 --danger:#ef4444;--green:#22c55e;
}
body{
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:var(--bg);color:var(--text);min-height:100vh;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:680px;margin:auto;min-height:100vh;padding-bottom:85px}

/* TOP */
.top{
 position:sticky;top:0;z-index:20;
 background:rgba(8,9,13,.88);backdrop-filter:blur(18px);
 border-bottom:1px solid var(--line);
 padding:14px 16px;
}
.toprow{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:21px;font-weight:800}
.logo span{color:var(--primary)}
.iconbtn{
 width:40px;height:40px;border-radius:50%;
 background:var(--card2);color:white;font-size:19px;
}
.search{
 margin-top:12px;background:var(--card);
 border:1px solid var(--line);border-radius:14px;
 display:flex;align-items:center;padding:0 13px;
}
.search input{
 width:100%;background:none;border:0;outline:0;
 color:white;padding:12px 9px;
}

/* CONTENT */
.content{padding:16px}
.hero{
 background:linear-gradient(135deg,#201341,#111827);
 border:1px solid #332252;border-radius:22px;padding:22px;
 margin-bottom:18px;
}
.hero h1{font-size:25px;margin-bottom:7px}
.hero p{color:#c4c6d0;line-height:1.5}
.hero button{
 margin-top:16px;background:var(--primary);color:white;
 padding:11px 17px;border-radius:12px;font-weight:700;
}
.sectiontitle{
 display:flex;justify-content:space-between;align-items:center;
 margin:20px 0 11px;
}
.sectiontitle h2{font-size:18px}
.sectiontitle span{font-size:13px;color:var(--muted)}

.categories{
 display:flex;gap:9px;overflow-x:auto;padding-bottom:5px;
}
.categories::-webkit-scrollbar{display:none}
.cat{
 white-space:nowrap;padding:9px 14px;border-radius:20px;
 background:var(--card);border:1px solid var(--line);color:#bbb;
}
.cat.active{background:var(--primary);border-color:var(--primary);color:white}

/* POST */
.post{
 background:var(--card);border:1px solid var(--line);
 border-radius:18px;margin-bottom:14px;overflow:hidden;
}
.postimg{width:100%;max-height:280px;object-fit:cover}
.postbody{padding:16px}
.postmeta{display:flex;align-items:center;gap:9px}
.avatar{
 width:38px;height:38px;border-radius:50%;
 background:linear-gradient(135deg,#8b5cf6,#ec4899);
 display:grid;place-items:center;font-weight:800;
}
.author{font-size:14px;font-weight:700}
.time{font-size:12px;color:var(--muted)}
.badge{
 margin-left:auto;background:#241d38;color:#bca5ff;
 padding:5px 9px;border-radius:10px;font-size:11px;
}
.post h3{font-size:19px;margin:14px 0 7px}
.post p{
 color:#b7bac7;line-height:1.6;
 display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;
 overflow:hidden;white-space:pre-wrap;
}
.actions{
 display:flex;gap:8px;border-top:1px solid var(--line);
 margin-top:14px;padding-top:12px;
}
.action{
 background:none;color:#999cab;padding:6px 8px;border-radius:9px;
}
.action:hover{background:var(--card2);color:white}
.action.liked{color:#f43f5e}

/* MODAL */
.modal{
 position:fixed;inset:0;background:rgba(0,0,0,.72);
 display:none;align-items:flex-end;z-index:50;
}
.modal.show{display:flex}
.sheet{
 width:100%;max-width:680px;margin:auto;
 background:#101218;border:1px solid var(--line);
 border-radius:24px 24px 0 0;padding:20px;
 max-height:92vh;overflow:auto;
}
.sheethead{
 display:flex;justify-content:space-between;align-items:center;
 margin-bottom:18px;
}
.close{
 background:var(--card2);color:white;width:38px;height:38px;border-radius:50%;
}
label{display:block;color:#aaa;font-size:13px;margin:13px 0 6px}
input,textarea,select{
 width:100%;background:var(--card);color:white;
 border:1px solid var(--line);border-radius:12px;
 padding:12px;outline:none;
}
textarea{min-height:180px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
.primary{
 width:100%;background:var(--primary);color:white;
 padding:13px;border-radius:12px;font-weight:700;margin-top:16px;
}
.secondary{
 width:100%;background:var(--card2);color:white;
 padding:12px;border-radius:12px;margin-top:9px;
}
.preview{
 width:100%;max-height:220px;object-fit:cover;
 border-radius:13px;margin-top:10px;display:none;
}

/* PROFILE */
.profile{
 text-align:center;background:var(--card);
 border:1px solid var(--line);border-radius:20px;padding:25px;
}
.bigavatar{
 width:82px;height:82px;border-radius:50%;
 background:linear-gradient(135deg,#8b5cf6,#ec4899);
 display:grid;place-items:center;font-size:30px;font-weight:800;
 margin:auto auto 12px;
}
.stats{display:flex;justify-content:space-around;margin-top:20px}
.stat b{display:block;font-size:19px}
.stat span{color:var(--muted);font-size:12px}

/* EMPTY */
.empty{text-align:center;padding:45px 15px;color:var(--muted)}
.empty div{font-size:42px;margin-bottom:10px}

/* NAV */
.bottom{
 position:fixed;bottom:0;left:0;right:0;z-index:30;
 background:rgba(12,13,18,.95);backdrop-filter:blur(18px);
 border-top:1px solid var(--line);
}
.nav{
 max-width:680px;margin:auto;height:70px;
 display:flex;justify-content:space-around;align-items:center;
}
.nav button{
 background:none;color:#777b89;display:flex;
 flex-direction:column;align-items:center;gap:4px;
 font-size:11px;
}
.nav button b{font-size:20px}
.nav button.active{color:#a78bfa}
.writebtn{
 width:54px!important;height:54px;border-radius:18px!important;
 background:var(--primary)!important;color:white!important;
 margin-top:-25px;box-shadow:0 8px 25px #0008;
}
.toast{
 position:fixed;left:50%;bottom:85px;transform:translateX(-50%);
 background:#fff;color:#111;padding:11px 17px;border-radius:12px;
 display:none;z-index:100;font-size:14px;
}
.toast.show{display:block}
.online{
 font-size:11px;color:var(--green);margin-top:7px;
}
@media(min-width:700px){
 .bottom{left:50%;right:auto;width:680px;transform:translateX(-50%)}
}
</style>
</head>

<body>

<div class="app">

<header class="top">
 <div class="toprow">
  <div class="logo">আমার <span>ডায়েরি</span></div>
  <button class="iconbtn" onclick="openProfile()">👤</button>
 </div>

 <div class="search">
  🔍
  <input id="search" placeholder="গল্প, উপন্যাস, কবিতা খুঁজুন..." oninput="render()">
 </div>
</header>

<main class="content" id="app"></main>

</div>

<!-- WRITE MODAL -->
<div class="modal" id="writeModal">
 <div class="sheet">
  <div class="sheethead">
   <h2>✍️ নতুন লেখা</h2>
   <button class="close" onclick="closeWrite()">✕</button>
  </div>

  <label>লেখার ধরন</label>
  <select id="type">
   <option value="গল্প">📖 গল্প</option>
   <option value="উপন্যাস">📚 উপন্যাস</option>
   <option value="কবিতা">📝 কবিতা</option>
   <option value="ডায়েরি">📔 ডায়েরি</option>
   <option value="অন্যান্য">✨ অন্যান্য</option>
  </select>

  <label>শিরোনাম</label>
  <input id="title" placeholder="তোমার লেখার নাম...">

  <label>লেখা</label>
  <textarea id="body" placeholder="এখানে তোমার গল্প/কবিতা/ডায়েরি লিখো..."></textarea>

  <label>ছবি যোগ করো</label>
  <input type="file" id="image" accept="image/*" onchange="previewImage(event)">
  <img id="preview" class="preview">

  <label>Visibility</label>
  <select id="visibility">
   <option value="public">🌍 Public</option>
   <option value="private">🔒 Private</option>
  </select>

  <button class="primary" onclick="publish()">🚀 Publish</button>
  <button class="secondary" onclick="saveDraft()">💾 Save Draft</button>
 </div>
</div>

<!-- PROFILE MODAL -->
<div class="modal" id="profileModal">
 <div class="sheet">
  <div class="sheethead">
   <h2>👤 আমার Profile</h2>
   <button class="close" onclick="closeProfile()">✕</button>
  </div>

  <div class="profile">
   <div class="bigavatar" id="profileAvatar">M</div>
   <h2 id="profileName">MONORANJON</h2>
   <p id="profileUsername" style="color:#999">@writer</p>
   <div class="stats">
    <div class="stat"><b id="postCount">0</b><span>লেখা</span></div>
    <div class="stat"><b id="likeCount">0</b><span>Likes</span></div>
    <div class="stat"><b>0</b><span>Followers</span></div>
   </div>
  </div>

  <label>নাম</label>
  <input id="nameInput" placeholder="তোমার নাম">

  <label>Username</label>
  <input id="usernameInput" placeholder="@username">

  <label>Bio</label>
  <textarea id="bioInput" style="min-height:100px" placeholder="নিজের সম্পর্কে লিখো..."></textarea>

  <button class="primary" onclick="saveProfile()">Save Profile</button>
 </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom">
 <nav class="nav">
  <button id="navHome" class="active" onclick="home()">
   <b>⌂</b>Home
  </button>

  <button onclick="showCategory('গল্প')">
   <b>📖</b>Stories
  </button>

  <button class="writebtn" onclick="openWrite()">
   <b>＋</b>
  </button>

  <button onclick="showCategory('উপন্যাস')">
   <b>📚</b>Novel
  </button>

  <button onclick="openProfile()">
   <b>👤</b>Profile
  </button>
 </nav>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY="amarDiaryV3";
const PROFILE="amarDiaryProfileV3";

let data=JSON.parse(localStorage.getItem(KEY)||"[]");
let profile=JSON.parse(localStorage.getItem(PROFILE)||JSON.stringify({
 name:"MONORANJON",
 username:"writer",
 bio:"আমি আমার গল্পগুলো এখানে লিখি।"
}));

let currentCategory="সব";
let currentImage="";

function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
}

function toast(msg){
 const t=document.getElementById("toast");
 t.textContent=msg;
 t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),1800);
}

function home(){
 currentCategory="সব";
 document.getElementById("search").value="";
 render();
}

function showCategory(cat){
 currentCategory=cat;
 render();
}

function render(){
 const app=document.getElementById("app");
 const query=document.getElementById("search").value.toLowerCase().trim();

 let posts=data.filter(p=>p.visibility==="public");

 if(currentCategory!=="সব"){
  posts=posts.filter(p=>p.type===currentCategory);
 }

 if(query){
  posts=posts.filter(p=>
   p.title.toLowerCase().includes(query) ||
   p.body.toLowerCase().includes(query) ||
   p.type.toLowerCase().includes(query)
  );
 }

 let html=`
 <section class="hero">
  <h1>তোমার গল্প, তোমার ডায়েরি ✨</h1>
  <p>গল্প, উপন্যাস, কবিতা ও জীবনের কথা নিজের মতো করে লিখে রাখো।</p>
  <button onclick="openWrite()">✍️ লেখা শুরু করো</button>
  <div class="online">● Offline-ready</div>
 </section>

 <div class="sectiontitle">
  <h2>ক্যাটাগরি</h2>
  <span>${posts.length} লেখা</span>
 </div>

 <div class="categories">
  ${["সব","গল্প","উপন্যাস","কবিতা","ডায়েরি","অন্যান্য"].map(c=>
   `<button class="cat ${currentCategory===c?"active":""}"
   onclick="${c==="সব"?"home()":"showCategory('"+c+"')"}">${c}</button>`
  ).join("")}
 </div>

 <div class="sectiontitle">
  <h2>${currentCategory==="সব"?"সবার লেখা":currentCategory}</h2>
  <span>Latest</span>
 </div>
 `;

 if(!posts.length){
  html+=`
   <div class="empty">
    <div>📖</div>
    <p>এখনো কোনো লেখা নেই।</p>
    <button class="primary" onclick="openWrite()">প্রথম লেখা লিখুন</button>
   </div>`;
 }else{
  html+=posts.map(postCard).join("");
 }

 app.innerHTML=html;
}

function postCard(p){
 return `
 <article class="post">
  ${p.image?`<img class="postimg" src="${p.image}">`:""}

  <div class="postbody">
   <div class="postmeta">
    <div class="avatar">${escapeHTML((p.author||"M")[0].toUpperCase())}</div>
    <div>
     <div class="author">${escapeHTML(p.author||profile.name)}</div>
     <div class="time">${formatDate(p.date)}</div>
    </div>
    <div class="badge">${escapeHTML(p.type)}</div>
   </div>

   <h3>${escapeHTML(p.title)}</h3>
   <p>${escapeHTML(p.body)}</p>

   <div class="actions">
    <button class="action ${p.liked?"liked":""}" onclick="likePost('${p.id}')">
     ${p.liked?"❤️":"♡"} ${p.likes||0}
    </button>
    <button class="action" onclick="commentPost('${p.id}')">
     💬 ${p.comments||0}
    </button>
    <button class="action" onclick="sharePost('${p.id}')">↗ Share</button>
    <button class="action" onclick="deletePost('${p.id}')">🗑</button>
   </div>
  </div>
 </article>`;
}

function openWrite(){
 document.getElementById("writeModal").classList.add("show");
}

function closeWrite(){
 document.getElementById("writeModal").classList.remove("show");
}

function previewImage(e){
 const file=e.target.files[0];
 if(!file)return;

 const reader=new FileReader();
 reader.onload=()=>{
  currentImage=reader.result;
  const img=document.getElementById("preview");
  img.src=currentImage;
  img.style.display="block";
 };
 reader.readAsDataURL(file);
}

function getForm(){
 const title=document.getElementById("title").value.trim();
 const body=document.getElementById("body").value.trim();

 if(!title||!body){
  toast("শিরোনাম ও লেখা দিতে হবে");
  return null;
 }

 return {
  id:Date.now().toString(),
  title,
  body,
  type:document.getElementById("type").value,
  visibility:document.getElementById("visibility").value,
  image:currentImage,
  author:profile.name,
  date:new Date().toISOString(),
  likes:0,
  comments:0,
  liked:false
 };
}

function publish(){
 const post=getForm();
 if(!post)return;

 data.unshift(post);
 save();
 resetWrite();
 closeWrite();
 home();
 toast("লেখা প্রকাশ হয়েছে 🎉");
}

function saveDraft(){
 const post=getForm();
 if(!post)return;

 post.visibility="private";
 post.draft=true;
 data.unshift(post);
 save();
 resetWrite();
 closeWrite();
 toast("Draft হিসেবে সংরক্ষণ হয়েছে 💾");
}

function resetWrite(){
 ["title","body"].forEach(id=>document.getElementById(id).value="");
 document.getElementById("image").value="";
 document.getElementById("preview").style.display="none";
 currentImage="";
}

function likePost(id){
 const p=data.find(x=>x.id===id);
 if(!p)return;

 p.liked=!p.liked;
 p.likes=(p.likes||0)+(p.liked?1:-1);
 save();
 render();
}

function commentPost(id){
 const text=prompt("তোমার comment লিখো:");
 if(!text)return;

 const p=data.find(x=>x.id===id);
 if(p){
  p.comments=(p.comments||0)+1;
  save();
  toast("Comment যোগ হয়েছে 💬");
  render();
 }
}

function sharePost(id){
 const p=data.find(x=>x.id===id);
 if(!p)return;

 const text=p.title+" — আমার ডায়েরি";

 if(navigator.share){
  navigator.share({title:p.title,text});
 }else{
  navigator.clipboard?.writeText(text);
  toast("Share text copied");
 }
}

function deletePost(id){
 if(!confirm("এই লেখাটি delete করতে চান?"))return;
 data=data.filter(p=>p.id!==id);
 save();
 render();
 toast("লেখা মুছে ফেলা হয়েছে");
}

function openProfile(){
 document.getElementById("profileName").textContent=profile.name;
 document.getElementById("profileUsername").textContent="@"+profile.username;
 document.getElementById("profileAvatar").textContent=
  profile.name.charAt(0).toUpperCase();

 document.getElementById("nameInput").value=profile.name;
 document.getElementById("usernameInput").value=profile.username;
 document.getElementById("bioInput").value=profile.bio;

 document.getElementById("postCount").textContent=data.length;
 document.getElementById("likeCount").textContent=
  data.reduce((n,p)=>n+(p.likes||0),0);

 document.getElementById("profileModal").classList.add("show");
}

function closeProfile(){
 document.getElementById("profileModal").classList.remove("show");
}

function saveProfile(){
 profile={
  name:document.getElementById("nameInput").value.trim()||"MONORANJON",
  username:document.getElementById("usernameInput").value.trim()||"writer",
  bio:document.getElementById("bioInput").value.trim()
 };

 localStorage.setItem(PROFILE,JSON.stringify(profile));

 data.forEach(p=>p.author=profile.name);
 save();

 closeProfile();
 render();
 toast("Profile saved ✅");
}

function formatDate(date){
 try{
  return new Date(date).toLocaleDateString("bn-BD",{
   year:"numeric",month:"short",day:"numeric"
  });
 }catch(e){return ""}
}

function escapeHTML(str){
 return String(str).replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#039;"
 }[m]));
}

/* Close modal when clicking outside */
document.querySelectorAll(".modal").forEach(m=>{
 m.addEventListener("click",e=>{
  if(e.target===m)m.classList.remove("show");
 });
});

/* PWA service worker */
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("sw.js").catch(()=>{});
 });
}

render();
</script>

</body>
</html>

<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>আমার ডায়েরি</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f8fafc;font-family:system-ui,"Noto Sans Bengali",sans-serif}
header{padding:16px;background:#111827;position:sticky;top:0;z-index:5;border-bottom:1px solid #263047}
.wrap{max-width:760px;margin:auto;padding:16px}
h1{margin:0;font-size:23px}
.sub,.muted{color:#94a3b8;font-size:13px}
.card{background:#121a2b;border:1px solid #263047;border-radius:18px;padding:16px;margin:12px 0}
input,textarea,select{width:100%;background:#0b1220;color:white;border:1px solid #334155;border-radius:12px;padding:12px;margin:6px 0 10px;font:inherit}
textarea{min-height:180px}
button{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}
.primary{background:white;color:#111827}
.secondary{background:#263047;color:white}
.danger{background:#7f1d1d;color:white}
.row{display:flex;gap:8px}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:#111827;display:flex;z-index:10;border-top:1px solid #263047}
nav button{flex:1;background:none;color:#94a3b8}
nav button.active{color:white}
.hidden{display:none}
.tag{display:inline-block;background:#263047;padding:5px 9px;border-radius:20px;font-size:12px}
.post h2{margin:8px 0}
.post p{white-space:pre-wrap;line-height:1.7}
.post img{max-width:100%;border-radius:14px}
.status{background:#162033;padding:10px;border-radius:10px;font-size:13px}
.avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;background:#263047}
.center{text-align:center}
</style>
</head>

<body>

<header>
<div class="wrap">
<h1>📖 আমার ডায়েরি</h1>
<div class="sub">গল্প • উপন্যাস • কবিতা • ডায়েরি</div>
</div>
</header>

<main class="wrap">

<div id="status" class="status">
🟢 অ্যাপ প্রস্তুত — তোমার লেখা এই ফোনে সংরক্ষিত হবে।
</div>

<section id="home">
<div class="card">
<h2>🔎 লেখা খুঁজুন</h2>
<input id="search" placeholder="শিরোনাম বা লেখা লিখে খুঁজুন...">
</div>
<div id="feed"></div>
</section>

<section id="write" class="hidden">
<div class="card">
<h2>✍️ নতুন লেখা</h2>

<input id="title" placeholder="লেখার শিরোনাম">

<div class="row">
<select id="type">
<option>উপন্যাস</option>
<option>গল্প</option>
<option>কবিতা</option>
<option>ডায়েরি</option>
<option>অন্যান্য</option>
</select>

<select id="visibility">
<option value="public">সবার জন্য</option>
<option value="private">শুধু আমি</option>
</select>
</div>

<textarea id="body" placeholder="তোমার লেখা এখানে লিখো..."></textarea>

<input id="image" type="file" accept="image/*">

<div class="row">
<button class="secondary" onclick="saveDraft()">ড্রাফট</button>
<button class="primary" onclick="publish()">প্রকাশ করুন</button>
</div>

</div>
</section>

<section id="profile" class="hidden">

<div class="card center">
<h2>👤 আমার প্রোফাইল</h2>

<img id="avatarPreview" class="avatar">

<input id="avatar" type="file" accept="image/*">

<input id="name" placeholder="তোমার নাম">
<input id="username" placeholder="@username">

<textarea id="bio" style="min-height:100px"
placeholder="তোমার সম্পর্কে লিখো..."></textarea>

<button class="primary" onclick="saveProfile()">
প্রোফাইল সেভ
</button>
</div>

<div class="card">
<h3>📊 আমার লেখা</h3>
<div id="myCount"></div>
</div>

</section>

<section id="admin" class="hidden">

<div class="card">
<h2>🛡️ Admin Panel</h2>
<p class="muted">
এই version-এর Admin local demo। আসল online admin পরে secure backend দিয়ে করা হবে।
</p>
</div>

<div id="adminList"></div>

</section>

</main>

<nav>
<button class="active" onclick="showPage('home',this)">🏠<br>হোম</button>
<button onclick="showPage('write',this)">✍️<br>লিখুন</button>
<button onclick="showPage('profile',this)">👤<br>প্রোফাইল</button>
<button onclick="showPage('admin',this)">🛡️<br>Admin</button>
</nav>

<script>

const KEY="amarDiaryApp";

let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
profile:{
name:"অতিথি",
username:"guest",
bio:"",
avatar:""
},
posts:[]
};

function save(){
localStorage.setItem(KEY,JSON.stringify(data));
}

function esc(s=""){
return s.replace(/[&<>"']/g,
x=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[x]));
}

function showPage(id,btn){

document.querySelectorAll("main section")
.forEach(x=>x.classList.add("hidden"));

document.getElementById(id).classList.remove("hidden");

document.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

if(id==="home")renderFeed();
if(id==="profile")renderProfile();
if(id==="admin")renderAdmin();

}

function renderFeed(){

let q=(document.getElementById("search").value||"")
.toLowerCase();

let posts=data.posts
.filter(p=>p.visibility==="public")
.filter(p=>(p.title+" "+p.body+" "+p.type)
.toLowerCase().includes(q));

let box=document.getElementById("feed");

if(!posts.length){
box.innerHTML=`
<div class="card center">
<h3>এখনো কোনো প্রকাশিত লেখা নেই</h3>
<p class="muted">✍️ লিখুন থেকে তোমার প্রথম লেখা প্রকাশ করো।</p>
</div>`;
return;
}

box.innerHTML=posts.slice().reverse().map(p=>`

<article class="card post">

<span class="tag">${esc(p.type)}</span>

<h2>${esc(p.title)}</h2>

<div class="muted">
${esc(p.author)} • ${new Date(p.created).toLocaleString("bn-BD")}
</div>

${p.image?`<img src="${p.image}">`:""}

<p>${esc(p.body)}</p>

<button class="secondary"
onclick="likePost('${p.id}')">
❤️ ${p.likes||0}
</button>

<button class="secondary"
onclick="commentPost('${p.id}')">
💬 মন্তব্য
</button>

</article>

`).join("");

}

document.getElementById("search")
.addEventListener("input",renderFeed);

function readImage(input,callback){

let file=input.files[0];

if(!file){
callback("");
return;
}

let reader=new FileReader();

reader.onload=()=>callback(reader.result);

reader.readAsDataURL(file);

}

function createPost(isPublic){

let title=document.getElementById("title").value.trim();
let body=document.getElementById("body").value.trim();

if(!title||!body){
alert("শিরোনাম এবং লেখা দাও।");
return;
}

readImage(document.getElementById("image"),image=>{

let post={
id:Date.now().toString(),
title:title,
body:body,
type:document.getElementById("type").value,
visibility:isPublic?
document.getElementById("visibility").value:
"private",
author:data.profile.name||"অতিথি",
image:image,
likes:0,
comments:[],
created:Date.now()
};

data.posts.push(post);

save();

document.getElementById("title").value="";
document.getElementById("body").value="";
document.getElementById("image").value="";

alert(isPublic?
"✅ লেখা প্রকাশ হয়েছে!":
"✅ ড্রাফট সেভ হয়েছে!");

renderFeed();

showPage("home",
document.querySelector("nav button"));

});

}

function publish(){
createPost(true);
}

function saveDraft(){
createPost(false);
}

function likePost(id){

let post=data.posts.find(p=>p.id===id);

if(post){
post.likes=(post.likes||0)+1;
save();
renderFeed();
}

}

function commentPost(id){

let post=data.posts.find(p=>p.id===id);

if(!post)return;

let text=prompt("তোমার মন্তব্য লিখো:");

if(text){

post.comments=post.comments||[];

post.comments.push({
text:text,
date:Date.now()
});

save();

alert("💬 মন্তব্য সেভ হয়েছে।");

}

}

function renderProfile(){

document.getElementById("name").value=data.profile.name;
document.getElementById("username").value=data.profile.username;
document.getElementById("bio").value=data.profile.bio;

document.getElementById("avatarPreview").src=
data.profile.avatar||"";

document.getElementById("myCount").innerText=
"তোমার মোট লেখা: "+data.posts.length;

}

document.getElementById("avatar")
.addEventListener("change",function(){

readImage(this,img=>{

data.profile.avatar=img;

document.getElementById("avatarPreview").src=img;

save();

});

});

function saveProfile(){

data.profile.name=
document.getElementById("name").value.trim()||"অতিথি";

data.profile.username=
document.getElementById("username").value.trim()||"guest";

data.profile.bio=
document.getElementById("bio").value.trim();

save();

alert("✅ প্রোফাইল সেভ হয়েছে!");

}

function renderAdmin(){

let box=document.getElementById("adminList");

if(!data.posts.length){

box.innerHTML=
`<div class="card">কোনো লেখা নেই।</div>`;

return;

}

box.innerHTML=data.posts.slice().reverse()
.map(p=>`

<div class="card">

<h3>${esc(p.title)}</h3>

<p class="muted">
${esc(p.type)} • ${esc(p.author)}
</p>

<button class="danger"
onclick="deletePost('${p.id}')">
ডিলিট
</button>

</div>

`).join("");

}

function deletePost(id){

if(!confirm("এই লেখা ডিলিট করবে?"))return;

data.posts=data.posts.filter(p=>p.id!==id);

save();

renderAdmin();
renderFeed();

}

window.addEventListener("online",()=>{
document.getElementById("status").innerText=
"🟢 অনলাইন";
});

window.addEventListener("offline",()=>{
document.getElementById("status").innerText=
"🔴 অফলাইন — লেখা ফোনেই সেভ হবে।";
});

renderFeed();

</script>

</body>
</html>
